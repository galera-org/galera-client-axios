name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: "npm"
          check-latest: true

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build
        run: npm run build
